# Databricks Asset Bundle for the Repair Triage app.
# Workspace ID: 7474652709340945
#
#   (cd frontend && npm run build)        # build the UI first
#   databricks bundle validate
#   databricks bundle deploy
#   databricks bundle run repair_triage_agents   # rebuild silver_real/gold_real (Agent 1 -> 2 -> 3)
#   databricks bundle run repair_triage_app

bundle:
  name: repair-triage

workspace:
  host: https://dbc-45c9154d-c76b.cloud.databricks.com

sync:
  exclude:
    - frontend/node_modules
    - frontend/src
    - .venv
    - "**/__pycache__"

resources:
  apps:
    repair_triage_app:
      name: repair-triage-ui
      description: "Technician triage cards, manager accuracy view, and the triage assistant"
      source_code_path: .
      # Names must match the valueFrom keys in app.yaml
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: 6e4f969ac71d3b26 # Serverless Starter Warehouse
            permission: CAN_USE
        - name: agent-endpoint
          serving_endpoint:
            name: mas-65748dd7-endpoint
            permission: CAN_QUERY

  jobs:
    repair_triage_agents:
      name: repair-triage-agents
      description: "Agent 1 (extract SAP repair lines) -> Agent 2 (patterns + recommendations) -> Agent 3 (evaluation + dashboard insights). Writes ultraviolet.silver_real / gold_real."
      tasks:
        - task_key: agent1_extract
          sql_task:
            warehouse_id: 6e4f969ac71d3b26
            file:
              path: ./pipeline/agent1_extract.sql
        - task_key: agent2_patterns
          depends_on:
            - task_key: agent1_extract
          sql_task:
            warehouse_id: 6e4f969ac71d3b26
            file:
              path: ./pipeline/agent2_patterns.sql
        - task_key: agent3_insights
          depends_on:
            - task_key: agent2_patterns
          sql_task:
            warehouse_id: 6e4f969ac71d3b26
            file:
              path: ./pipeline/agent3_insights.sql

targets:
  dev:
    mode: development
    default: true
